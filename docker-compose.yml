services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://studyai:studyai@postgres:5432/studyai
      DATABASE_SSL: "false"
      AUTH_SECRET: ${AUTH_SECRET:-desenvolvimento-local-troque-este-segredo-123456}
      S3_BUCKET: studyai
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-studyai}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-studyai-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: none
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    expose:
      - "3000"
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyai
      POSTGRES_USER: studyai
      POSTGRES_PASSWORD: studyai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyai -d studyai"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-studyai}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-studyai-local-secret}
    volumes:
      - object-data:/data
    expose:
      - "9000"
  minio-setup:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done; mc mb --ignore-existing local/studyai; mc anonymous set none local/studyai"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-studyai}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-studyai-local-secret}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      STUDYAI_DOMAIN: ${STUDYAI_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  object-data:
  caddy-data:
  caddy-config:
